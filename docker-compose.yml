services:
    postgres:
        image: postgres:17

        environment:
            POSTGRES_DB: palace_game
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: palace_game

        ports:
            - "5432:5432"

        volumes:
            - postgres-data:/var/lib/postgresql/data

    app:
        build: .
        container_name: palace_app
        restart: always
        ports:
            - "8080:8080"
        environment:
            - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/palace_game
            - SPRING_DATASOURCE_USERNAME=postgres
            - SPRING_DATASOURCE_PASSWORD=palace_game
            - SPRING_JPA_HIBERNATE_DDL_AUTO=update
        depends_on:
            - postgres
        networks:
            - palace-network

volumes:
    postgres-data:
